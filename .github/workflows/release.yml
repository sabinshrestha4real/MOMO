name: Dev Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      android_track:
        description: "Play Store track"
        required: false
        default: "internal"

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  android-playstore:
    name: Android -> Play Console (internal track)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

      - name: Verify keystore integrity
        run: |
          echo "Decoded keystore SHA256:"
          sha256sum android/app/release-keystore.jks
          echo ""
          echo "File size (bytes):"
          wc -c < android/app/release-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Debug key.properties (no secrets printed)
        run: |
          echo "storePassword length: $(grep storePassword android/key.properties | cut -d= -f2 | wc -c)"
          echo "keyPassword length: $(grep keyPassword android/key.properties | cut -d= -f2 | wc -c)"
          echo "keyAlias value: $(grep keyAlias android/key.properties | cut -d= -f2)"
          echo "--- verifying keystore opens with these credentials ---"
          keytool -list -v -keystore android/app/release-keystore.jks \
            -storepass "$(grep storePassword android/key.properties | cut -d= -f2)" \
            -alias "$(grep keyAlias android/key.properties | cut -d= -f2)" \
            > /dev/null && echo "✓ keystore opened successfully" || echo "✗ keystore FAILED to open with these credentials"

      - name: Decode Play Store service account key
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > android/fastlane/play-store-key.json

      - name: Build & upload to Play Console
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          PLAY_STORE_JSON_KEY_PATH: fastlane/play-store-key.json
          PLAY_TRACK: ${{ github.event.inputs.android_track || 'internal' }}
        run: bundle exec fastlane beta

      - name: Clean up secrets from disk
        if: always()
        run: |
          rm -f android/app/release-keystore.jks android/key.properties android/fastlane/play-store-key.json

      - name: Email QA the testing link
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "MOMO dev build #${{ github.run_number }} is up for testing"
          to: aasthastha143@gmail.com
          from: MOMO CI
          body: |
            A new dev build has been uploaded to the Play Console internal testing track.

            Build: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Opt-in / download link:
            ${{ vars.PLAY_INTERNAL_TESTING_URL }}

            If this is your first time, open the link on the device you'll test with, accept the invite, then install from the Play Store.